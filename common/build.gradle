plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    addModdingDependenciesTo(sourceSets.test)
}

dependencies {
    // Fabric and NeoForge both bundle Fabric Mixin, so it is safe to use it in common
    // If you need to update, check what version they are using to see what is compatible
    // https://github.com/neoforged/NeoForge/blob/26.3.x/gradle.properties#L37
    // https://github.com/FabricMC/fabric-loader/blob/master/gradle.properties#L12
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
    // Fabric and NeoForge both bundle MixinExtras, so it is safe to use it in common
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))

    testImplementation('org.junit.jupiter:junit-jupiter:5.11.3')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testImplementation('org.joml:joml:1.10.9')
    testImplementation('com.google.code.gson:gson:2.14.0')

}

sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    // Die Tests der Selbsttest-Auswahl (dev.SelfTestSelectionTest) brauchen die Klassen aus devtest, wie tools/fastcheck.sh test.
    test {
        compileClasspath += sourceSets.devtest.output
        runtimeClasspath += sourceSets.devtest.output
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonDevtestJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
    commonDevtestResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

// ---------------------------------------------------------------------------------------------------------------
// Sprachdateien: jedes Modul pflegt common/src/lang/<modul>/<sprache>.json; mergeLang führt sie sortiert zu
// common/src/main/resources/assets/<mod_id>/lang/<sprache>.json zusammen (Ergebnis wird mit eingecheckt).
// Doppelte Schlüssel (modulübergreifend oder in einer Datei) brechen den Build ab.
// ---------------------------------------------------------------------------------------------------------------
def langSourceDir = file('src/lang')
def langOutputDir = file("src/main/resources/assets/${mod_id}/lang")

tasks.register('mergeLang') {
    group = 'propwash'
    description = 'Führt die Modul-Sprachdateien (src/lang/<modul>/<sprache>.json) zusammen.'
    // Bewusst kein outputs.dir: das Ziel liegt in src/main/resources, das viele Tasks lesen. Der Task läuft daher
    // immer (schnell) und schreibt nur bei geänderten Inhalten.
    inputs.dir(langSourceDir)
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def generator = new groovy.json.JsonGenerator.Options().disableUnicodeEscaping().build()
        Map<String, Map<String, String>> merged = new TreeMap<>()
        Map<String, Map<String, String>> origin = [:]
        def modules = (langSourceDir.listFiles() ?: []).findAll { it.isDirectory() }.sort { it.name }
        modules.each { moduleDir ->
            (moduleDir.listFiles() ?: []).findAll { it.name.endsWith('.json') }.sort { it.name }.each { file ->
                def language = file.name - '.json'
                def text = file.getText('UTF-8')
                def keysInFile = propwashJsonObjectKeys(text)
                def duplicatesInFile = keysInFile.countBy { it }.findAll { it.value > 1 }.keySet()
                if (!duplicatesInFile.isEmpty()) {
                    throw new GradleException("Doppelte Sprachschlüssel in ${file}: ${duplicatesInFile}")
                }
                def data = slurper.parseText(text)
                if (!(data instanceof Map)) {
                    throw new GradleException("${file} ist kein JSON-Objekt")
                }
                def target = merged.computeIfAbsent(language) { new TreeMap<String, String>() }
                def targetOrigin = origin.computeIfAbsent(language) { [:] }
                data.each { key, value ->
                    if (!(value instanceof String)) {
                        throw new GradleException("${file}: Wert von '${key}' ist kein String")
                    }
                    if (target.containsKey(key)) {
                        throw new GradleException("Doppelter Sprachschlüssel '${key}' (${language}) in den Modulen '${targetOrigin[key]}' und '${moduleDir.name}'")
                    }
                    target[key] = value
                    targetOrigin[key] = moduleDir.name
                }
            }
        }
        def allKeys = merged.values().collectMany { it.keySet() }.toSet()
        merged.each { language, entries ->
            def missing = (allKeys - entries.keySet()).sort()
            if (!missing.isEmpty()) {
                logger.warn("mergeLang: ${language} fehlen ${missing.size()} Schlüssel: ${missing}")
            }
        }
        langOutputDir.mkdirs()
        merged.each { language, entries ->
            def lines = entries.collect { key, value -> '  ' + generator.toJson(key) + ': ' + generator.toJson(value) }
            def json = lines.isEmpty() ? '{}\n' : '{\n' + lines.join(',\n') + '\n}\n'
            def out = new File(langOutputDir, "${language}.json")
            if (!out.exists() || out.getText('UTF-8') != json) {
                out.setText(json, 'UTF-8')
            }
        }
        logger.lifecycle("mergeLang: ${merged.collect { lang, entries -> "${lang}=${entries.size()}" }.join(', ')} aus ${modules.size()} Modulen")
    }
}

/** Liefert alle Objekt-Schlüssel (auf jeder Ebene) eines JSON-Texts, inklusive Duplikaten. */
List<String> propwashJsonObjectKeys(String text) {
    List<String> keys = []
    int i = 0
    while (i < text.length()) {
        char c = text.charAt(i)
        if (c == '"' as char) {
            StringBuilder sb = new StringBuilder()
            i++
            while (i < text.length() && text.charAt(i) != ('"' as char)) {
                if (text.charAt(i) == ('\\' as char)) {
                    sb.append(text.charAt(i)).append(text.charAt(i + 1))
                    i += 2
                } else {
                    sb.append(text.charAt(i))
                    i++
                }
            }
            i++
            int j = i
            while (j < text.length() && Character.isWhitespace(text.charAt(j))) {
                j++
            }
            if (j < text.length() && text.charAt(j) == (':' as char)) {
                keys << sb.toString()
            }
        } else {
            i++
        }
    }
    return keys
}

tasks.matching { it.name in ['processResources', 'sourcesJar'] }.configureEach {
    dependsOn('mergeLang')
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonDevtestJava sourceSets.devtest.java.sourceDirectories.singleFile
    commonResources(sourceSets.main.resources.sourceDirectories.singleFile) {
        builtBy('mergeLang')
    }
    commonDevtestResources sourceSets.devtest.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

tasks.named('test', Test) {
    systemProperty 'propwash.rootDir', rootDir.absolutePath
    systemProperty 'propwash.testResources', file('src/test/resources').absolutePath
    useJUnitPlatform {
        if (!System.getenv('PROPWASH_CALIBRATION_ADDON')) {
            excludeTags 'addon-daten'
        }
    }
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

// Vorschau-Build (docs/preview-build.md): JUnit prüft das Kennzeichen im Klassenpfad gegen den Schalter -Ppropwash_preview.
tasks.named('test', Test) {
    systemProperty 'propwash.preview.expected', rootProject.ext.propwashPreview ? 'true' : 'false'
}

// Vorschau-Schalter als Konstante (docs/preview-build.md, Befund PREVMARK2-1): Jeder Gradle-Build erzeugt
// preview/PreviewSwitch aus der Vorlage in src/main/java mit ENABLED = <Schalter -Ppropwash_preview> und VERSION = <Version>
// und kompiliert die erzeugte Klasse statt der Vorlage (fabric und neoforge über commonPreviewSwitch, siehe
// multiloader-loader.gradle). Das Spiel liest den Schalter nie zur Laufzeit. Ohne Gradle (tools/fastcheck.sh, IDE) gilt die
// Vorlage: ENABLED = false.
def previewSwitchTemplate = file('src/main/java/de/lardtom/propwash/preview/PreviewSwitch.java')
def previewSwitchDir = layout.buildDirectory.dir('generated/sources/previewSwitch/java')
def generatePreviewSwitch = tasks.register('generatePreviewSwitch') {
    def enabled = rootProject.ext.propwashPreview ? 'true' : 'false'
    def shownVersion = version.toString()
    def template = previewSwitchTemplate
    def outDir = previewSwitchDir
    inputs.property('enabled', enabled)
    inputs.property('version', shownVersion)
    inputs.file(template)
    outputs.dir(outDir)
    doLast {
        if (!(shownVersion ==~ /[0-9A-Za-z.+_-]+/)) {
            throw new GradleException("Version ${shownVersion}: im Vorschau-Wasserzeichen nur Ziffern, Buchstaben und . + _ - (docs/preview-build.md)")
        }
        def enabledLine = '    public static final boolean ENABLED = false;\n'
        def versionLine = '    public static final String VERSION = "";\n'
        def text = template.getText('UTF-8')
        if (text.count(enabledLine) != 1 || text.count(versionLine) != 1) {
            throw new GradleException("${template}: Vorlage braucht genau eine Zeile ENABLED = false und eine Zeile VERSION = \"\"")
        }
        text = text.replace(enabledLine, "    public static final boolean ENABLED = ${enabled};\n")
                .replace(versionLine, "    public static final String VERSION = \"${shownVersion}\";\n")
        def root = outDir.get().asFile
        root.deleteDir()
        def target = new File(root, 'de/lardtom/propwash/preview/PreviewSwitch.java')
        target.parentFile.mkdirs()
        target.setText(text, 'UTF-8')
    }
}

configurations {
    commonPreviewSwitch {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonPreviewSwitch(previewSwitchDir.get().asFile) {
        builtBy(generatePreviewSwitch)
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(generatePreviewSwitch)
    source(previewSwitchDir)
    exclude { it.file == previewSwitchTemplate }
}
