# Important Notes:
# Every field you add must be added to the expandProps map in build-logic/src/main/groovy/multiloader-common.gradle.

# Project
version=0.5.0
group=de.lardtom.propwash
maven_group=de.lardtom
java_version=25

# Common
minecraft_version=26.3
mod_name=Propwash FPV
mod_author=lardtom
mod_id=propwash
license=LicenseRef-PolyForm-Shield-1.0.0 AND MIT
credits=Flight model, code and assets by lardtom. Inspired by the FPV community, Betaflight and EdgeTX.
homepage_url=https://modrinth.com/mod/propwash-fpv
description=FPV drone racing sim: build quadcopters from real parts and fly them in first person with your RC transmitter, a gamepad or the keyboard. Own flight model with a Betaflight-style flight controller, race gates with lap timing, analog and digital video, survival crafting and an animated Flight School.
minecraft_version_range=[26.3, 26.4)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.161.0+26.3
fabric_loader_version=0.19.5
# Mod Menu (optional, nur compileOnly für den Konfigurator-Knopf in der Mod-Liste)
modmenu_version=21.0.0
# LambDynamicLights (optional, nur compileOnly: LED-Streifen als echte Lichtquelle, compat.lambdynamiclights)
lambdynamiclights_version=4.13.0+26.3
yumi_commons_version=2.0.0

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.10-beta
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
# Build-Cache (~/.gradle/caches/build-cache-1, für alle Arbeitsbäume gemeinsam): Kompilieren und Javadoc kommen bei
# gleichen Eingaben aus dem Cache; Tests nie (siehe build.gradle). Konfigurations-Cache bleibt aus (docs/testing.md).
org.gradle.caching=true
