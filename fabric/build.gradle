plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'TerraformersMC'
                url = uri('https://maven.terraformersmc.com/releases/')
            }
        }
        filter {
            includeGroup('com.terraformersmc')
        }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    compileOnly("com.terraformersmc:modmenu:${modmenu_version}") {
        transitive = false
    }
    testImplementation('org.junit.jupiter:junit-jupiter:5.11.3')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

// Prüft Fabric-Interna gegen die echte Fabric API (Registerabgleich für NeoForge-Clients, docs/design/cross-loader-join.md):
// ändert ein Update der Fabric API das Format, wird dieser Test beim Bauen rot.
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed'
        exceptionFormat = 'full'
    }
}

// Mixins des Quell-Sets devtest (common/src/devtest/…/mixin/dev) brauchen eine Mod, die ihre Mixin-Config beim Start
// anmeldet. Die Hilfs-Mod propwash_devtest tut genau das: fabric.mod.json aus src/devtestMod, propwash.dev.mixins.json
// aus common/src/devtestMod. Sie hängt allein an den Läufen mit dem Quell-Set devtest; runClient, runServer und das
// Release-Jar kennen sie nicht.
sourceSets {
    devtestMod {
        resources.srcDir project(':common').file('src/devtestMod/resources')
    }
    devtest {
        runtimeClasspath += sourceSets.devtestMod.output
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.devtest
        }
        "${mod_id}_devtest" {
            sourceSet sourceSets.devtestMod
        }
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir(rootProject.propwashRunDirs.client)
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir(rootProject.propwashRunDirs.server)
        }
        // Selbsttest: legt eine Flachwelt an, führt alle SelfTest-Schritte aus und beendet das Spiel (:fabric:runClientSelftest).
        clientSelftest {
            client()
            source(sourceSets.devtest)
            setConfigName('Fabric Client Selftest')
            ideConfigGenerated(true)
            runDir(rootProject.propwashRunDirs.selftest)
            property('propwash.selftest', 'true')
            if (project.hasProperty('propwashScreenshots')) {
                property('propwash.screenshots', rootProject.file('docs/screenshots').absolutePath)
            }
            rootProject.propwashSelftestProperties.each { key, value -> property(key, value) }
            if (project.hasProperty('propwashFixtureWorld')) {
                property('propwash.selftest.fixtureWorld', rootProject.file(project.property('propwashFixtureWorld').toString()).absolutePath)
            }
            rootProject.propwashTestWindowEnv.each { key, value -> environmentVariable(key, value) }
        }
        // Start-Rauchtest: normaler Client ohne Selbsttest-Modus; Welt anlegen, betreten, verlassen, beenden (:fabric:runClientSmoke).
        clientSmoke {
            client()
            source(sourceSets.devtest)
            setConfigName('Fabric Client Smoke')
            ideConfigGenerated(true)
            runDir(rootProject.propwashRunDirs.smoke)
            property('propwash.smoketest', 'true')
            rootProject.propwashTestWindowEnv.each { key, value -> environmentVariable(key, value) }
        }
        // Server-Rauchtest: dedizierter Server ohne GUI, 100 Ticks nach dem Start mit einer Drohne, dann Ende (:fabric:runServerSmoke).
        serverSmoke {
            server()
            source(sourceSets.devtest)
            setConfigName('Fabric Server Smoke')
            ideConfigGenerated(true)
            runDir(rootProject.propwashRunDirs.serverSmoke)
            property('propwash.serversmoke', 'true')
        }
    }
}

// Test-Instanzen immer stumm starten (options.txt wird vor jedem Start gepatcht).
tasks.matching { it.name in ['runClient', 'runServer', 'runClientSelftest', 'runClientSmoke'] }.configureEach {
    dependsOn(rootProject.tasks.named('prepareRuns'))
}
tasks.matching { it.name == 'runServerSmoke' }.configureEach {
    dependsOn(rootProject.tasks.named('prepareServerSmoke'))
}

// Dev-Spieler mit Skin (propwashDevPlayer im Wurzel-Build): runClient immer, Selbst- und Rauchtest nur mit -PpropwashDevName.
[runClient: rootProject.propwashRunDirs.client, runClientSelftest: rootProject.propwashRunDirs.selftest,
 runClientSmoke: rootProject.propwashRunDirs.smoke].each { taskName, dir ->
    tasks.matching { it.name == taskName }.configureEach { task ->
        task.doFirst { rootProject.propwashDevPlayer(task, file(dir), taskName == 'runClient', []) }
    }
}

// devtest hat keine Ressourcen; ohne den leeren Ordner meldet Fabric Loader "Class path entries reference missing files".
tasks.matching { it.name in ['runClientSelftest', 'runClientSmoke', 'runServerSmoke'] }.configureEach {
    doFirst {
        sourceSets.devtest.output.resourcesDir.mkdirs()
        sourceSets.devtestMod.output.classesDirs.each { it.mkdirs() }
    }
}

// Selbsttest-/Rauchtest-Ergebnis auswerten: der Client schreibt PASS/FAIL nach propwash-selftest-result.txt.
[runClientSelftest: [dir: rootProject.propwashRunDirs.selftest, label: 'Selbsttest (Fabric)'],
 runClientSmoke   : [dir: rootProject.propwashRunDirs.smoke, label: 'Rauchtest (Fabric)'],
 runServerSmoke   : [dir: rootProject.propwashRunDirs.serverSmoke, label: 'Server-Rauchtest (Fabric)', scanLog: true]].each { taskName, cfg ->
    tasks.matching { it.name == taskName }.configureEach { task ->
        def resultFile = file("${cfg.dir}/propwash-selftest-result.txt")
        task.group = 'propwash'
        task.doFirst { resultFile.delete() }
        task.doLast {
            if (!resultFile.exists()) {
                throw new GradleException("${cfg.label}: keine Ergebnisdatei – Spiel abgestürzt oder vorzeitig beendet?")
            }
            def result = resultFile.getText('UTF-8').trim()
            if (!result.startsWith('PASS')) {
                throw new GradleException("${cfg.label} fehlgeschlagen: ${result}")
            }
            if (cfg.scanLog) {
                def logFile = file("${cfg.dir}/logs/latest.log")
                if (!logFile.exists()) {
                    throw new GradleException("${cfg.label}: kein logs/latest.log")
                }
                def bad = logFile.readLines('UTF-8').findAll { line ->
                    line =~ /\/(ERROR|FATAL)\]/ || line.contains('MixinApplyError') || line.contains('InvalidMixinException') ||
                            line.contains('InvalidInjectionException') || line.contains('Mixin apply failed')
                }
                if (!bad.isEmpty()) {
                    throw new GradleException("${cfg.label}: ${bad.size()} Fehlerzeilen im Log, erste: ${bad.first()}")
                }
            }
            logger.lifecycle("${cfg.label}: ${result}")
            def steps = file("${cfg.dir}/propwash-selftest-steps.md")
            if (taskName == 'runClientSelftest' && rootProject.propwashSelftestProperties.containsKey('propwash.selftest.list') && steps.exists()) {
                logger.lifecycle(steps.getText('UTF-8').split('\n## ')[0].trim())
                logger.lifecycle("Alle Schritte in Reihenfolge: ${rootProject.relativePath(steps)}")
            }
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

// Probe-Mod nsprobe (docs/namespace-guard.md): eigene Mod-Id, verletzt den Namensraum propwash absichtlich. Nur mit
// -PpropwashNsProbe=true liegt sie in den Läufen mit dem Quell-Set devtest (Selbsttest, Rauchtests); nie im Release-Jar.
sourceSets {
    nsprobe {
        java.srcDirs(project(':common').file('src/nsprobe/java'), project(':common').file('src/nsprobe/fabric/java'))
        resources.srcDirs(project(':common').file('src/nsprobe/resources'), project(':common').file('src/nsprobe/fabric/resources'))
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
if (findProperty('propwashNsProbe')?.toString() == 'true') {
    sourceSets.devtest.runtimeClasspath += sourceSets.nsprobe.output
    loom.mods.register('nsprobe') {
        sourceSet sourceSets.nsprobe
    }
}

// Web-Export (docs/web-export.md): dedizierter Server ohne devtest, ruft über die Konsole „propwash webexport <auswahl>“
// und danach „stop“ auf. Ergebnis in runs/web-export/propwash/web-export, Kopie in build/web-export der Wurzel.
// -PpropwashWebExportMods=<jar oder ordner>,… legt weitere Mods (etwa ein Add-on-Jar) in mods/ des Lauf-Ordners,
// sonst bleibt mods/ leer; -PpropwashWebExportSelection=<namensraum> exportiert nur einen Namensraum (Standard all).
// Die Konsole liest sofort ab dem Start; ein Befehl vor „Done“ liefe ohne Welt und schlüge fehl. Deshalb gibt diese
// Eingabe die Befehle erst frei, wenn das Log des Laufs „Done (“ zeigt (höchstens 10 Minuten).
class WebExportConsole extends InputStream {
    private final File log
    private final byte[] data
    private int position
    private boolean ready

    WebExportConsole(File log, byte[] data) {
        this.log = log
        this.data = data
    }

    private void waitForServer() {
        long deadline = System.currentTimeMillis() + 600_000L
        while (!ready && System.currentTimeMillis() < deadline) {
            if (log.isFile() && log.getText('UTF-8').contains('Done (')) {
                break
            }
            Thread.sleep(500)
        }
        ready = true
    }

    @Override
    int read() {
        waitForServer()
        return position < data.length ? (data[position++] & 0xff) : -1
    }

    @Override
    int read(byte[] buffer, int offset, int length) {
        waitForServer()
        if (position >= data.length) {
            return -1
        }
        int count = Math.min(length, data.length - position)
        System.arraycopy(data, position, buffer, offset, count)
        position += count
        return count
    }
}

def webExportRunDir = rootProject.propwashRunTag ? "runs/web-export-${rootProject.propwashRunTag}".toString() : 'runs/web-export'
loom {
    runs {
        webExport {
            server()
            setConfigName('Fabric Web Export')
            ideConfigGenerated(false)
            runDir(webExportRunDir)
        }
    }
}

tasks.matching { it.name == 'runWebExport' }.configureEach { task ->
    def dir = file(webExportRunDir)
    def port = rootProject.propwashServerPorts.fabric
    def selection = findProperty('propwashWebExportSelection')?.toString()?.trim() ?: 'all'
    def extraMods = (findProperty('propwashWebExportMods')?.toString() ?: '').split(',')*.trim().findAll { !it.isEmpty() }
    def exportDir = new File(dir, 'propwash/web-export')
    def copyDir = rootProject.layout.buildDirectory.dir('web-export').get().asFile
    task.group = 'propwash'
    task.description = 'Schreibt den Web-Export (Format 2) mit /propwash webexport auf einem dedizierten Server und beendet ihn.'
    if (!(selection ==~ /[a-z0-9_.-]+/)) {
        throw new GradleException("-PpropwashWebExportSelection=${selection}: nur all oder ein Namensraum aus [a-z0-9_.-]")
    }
    task.timeout = java.time.Duration.ofMinutes(20)
    task.standardInput = new WebExportConsole(new File(dir, 'logs/latest.log'), "propwash webexport ${selection}\nstop\n".getBytes('UTF-8'))
    task.doFirst {
        try {
            new ServerSocket(port).close()
        } catch (IOException e) {
            throw new GradleException("Web-Export: Port ${port} ist belegt (${e.message}); anderen Port mit -PpropwashServerPort=<n> wählen")
        }
        dir.mkdirs()
        new File(dir, 'eula.txt').setText('eula=true\n', 'UTF-8')
        new File(dir, 'server.properties').setText([
                'online-mode=false',
                "server-port=${port}".toString(),
                'level-type=minecraft\\:flat',
                'generator-settings={"layers"\\:[{"block"\\:"minecraft\\:bedrock","height"\\:1},{"block"\\:"minecraft\\:grass_block","height"\\:1}],"biome"\\:"minecraft\\:plains"}',
                'generate-structures=false',
                'view-distance=4',
                'simulation-distance=4',
                'sync-chunk-writes=false',
        ].join('\n') + '\n', 'UTF-8')
        new File(dir, 'world').deleteDir()
        new File(dir, 'logs/latest.log').delete()
        File mods = new File(dir, 'mods')
        mods.deleteDir()
        mods.mkdirs()
        extraMods.each { String entry ->
            File source = new File(entry)
            List<File> jars = source.isDirectory() ? (source.listFiles()?.findAll { it.name.endsWith('.jar') } ?: []) : [source]
            jars.each { File jar ->
                if (!jar.isFile()) {
                    throw new GradleException("Web-Export: ${jar} gibt es nicht")
                }
                java.nio.file.Files.copy(jar.toPath(), new File(mods, jar.name).toPath())
                logger.lifecycle("Web-Export: ${jar.name} in ${project.relativePath(mods)}")
            }
        }
        sourceSets.devtest.output.resourcesDir.mkdirs()
        sourceSets.devtestMod.output.classesDirs.each { it.mkdirs() }
    }
    task.doLast {
        def logFile = new File(dir, 'logs/latest.log')
        if (!logFile.exists()) {
            throw new GradleException('Web-Export: kein logs/latest.log – Server abgestürzt oder nicht gestartet?')
        }
        def lines = logFile.readLines('UTF-8')
        def result = lines.findAll { it.contains('Propwash-Web-Export: ') }
        if (result.isEmpty()) {
            throw new GradleException('Web-Export: keine Ergebniszeile im Log – Befehl nicht ausgeführt?')
        }
        def summary = result.last().substring(result.last().indexOf('Propwash-Web-Export: ') + 'Propwash-Web-Export: '.length())
        if (!summary.startsWith('PASS')) {
            throw new GradleException("Web-Export fehlgeschlagen: ${summary}")
        }
        def bad = lines.findAll { line ->
            line =~ /\/(ERROR|FATAL)\]/ || line.contains('MixinApplyError') || line.contains('InvalidMixinException') ||
                    line.contains('InvalidInjectionException') || line.contains('Mixin apply failed')
        }
        if (!bad.isEmpty()) {
            throw new GradleException("Web-Export: ${bad.size()} Fehlerzeilen im Log, erste: ${bad.first()}")
        }
        copyDir.deleteDir()
        project.copy {
            from exportDir
            into copyDir
        }
        logger.lifecycle("Web-Export: ${summary}")
        logger.lifecycle("Web-Export: ${project.relativePath(exportDir)}, Kopie in ${rootProject.relativePath(copyDir)}")
    }
}
